<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="WorldLeaders">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6EF"/>
      <stop offset="1" stop-color="#FCEADE"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="230" cy="120" r="150" fill="#FDB05A" opacity=".35" filter="url(#soft)"/>
  <circle cx="980" cy="330" r="180" fill="#48C0A6" opacity=".30" filter="url(#soft)"/>
  <circle cx="620" cy="60" r="120" fill="#9DBEF5" opacity=".30" filter="url(#soft)"/>
  <circle cx="1080" cy="90" r="90" fill="#B79CF0" opacity=".28" filter="url(#soft)"/>
  <!-- five figures (brand motif), enlarged and centered -->
  <g transform="translate(468,150) scale(3.6)">
    <rect x="7" y="55.5" width="50" height="4" rx="2" fill="#2A1E42" opacity=".10"/>
    <rect x="7.5" y="30" width="7" height="26" rx="3.5" fill="#9DBEF5"/><circle cx="11" cy="27.5" r="4.4" fill="#9DBEF5"/>
    <rect x="18" y="24" width="7" height="32" rx="3.5" fill="#48C0A6"/><circle cx="21.5" cy="21.5" r="4.4" fill="#48C0A6"/>
    <rect x="28.5" y="18" width="7" height="38" rx="3.5" fill="#FDB05A"/><circle cx="32" cy="15.5" r="4.4" fill="#FDB05A"/>
    <rect x="39" y="24" width="7" height="32" rx="3.5" fill="#FF8E72"/><circle cx="42.5" cy="21.5" r="4.4" fill="#FF8E72"/>
    <rect x="49.5" y="30" width="7" height="26" rx="3.5" fill="#B79CF0"/><circle cx="53" cy="27.5" r="4.4" fill="#B79CF0"/>
  </g>
</svg>
