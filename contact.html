<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact | WorldLeaders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact WorldLeaders." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <div class="container navbar">
      <a class="brand" href="index.html"><span class="dot"></span><span>WorldLeaders</span></a>
      <nav>
        <a href="approach.html">Philosophy</a>
        <a href="approach.html#approach">Approach</a>
        <a href="learning.html">Learning</a>
        <a href="neurodiversity.html">Neurodiversity</a>
        <a href="parents.html">For Parents</a>
        <a href="resources.html">Resources</a>
        <a class="active" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 style="font-size:42px;margin-top:0;">Contact</h1>
      <p class="section-sub">
        If you’re a parent, educator, or organization interested in our work, we’d love to hear from you.
      </p>

      <div class="card">
        <form action="https://formspree.io/f/mrezalkb" method="POST">
          <input type="hidden" name="_subject" value="New message from WorldLeaders website" />
          <label for="email">Your email</label>
          <input id="email" type="email" name="email" required placeholder="name@example.com" />

          <label for="message">Your message</label>
          <textarea id="message" name="message" required placeholder="How can we help?"></textarea>

          <div class="cta-row">
            <button class="btn primary" type="submit">Send message</button>
            <a class="btn" href="index.html">Back to home</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">© <span id="y"></span> WorldLeaders.</div>
  </footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
